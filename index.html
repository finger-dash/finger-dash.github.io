<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Finger Podium</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #10101c; }
  body {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; image-rendering: pixelated; }
  @supports (height: 100dvh) {
    canvas {
      width: min(100vw - env(safe-area-inset-left) - env(safe-area-inset-right), 177.78dvh);
    }
  }
  /* Only used to read the safe areas (notch, home indicator) from CSS. */
  #safe-area {
    position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #name-form {
    position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 8px; justify-content: center;
    padding: 8px max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left));
    background: #05050f; border-bottom: 3px solid #f9d56e;
  }
  #name-form[hidden] { display: none; }
  #name-form input, #name-form button {
    font-family: monospace; font-weight: bold; border: 0; border-radius: 0; padding: 8px 12px;
  }
  #name-input {
    width: 12em; background: #1f1f3a; color: #fff; text-transform: uppercase;
    user-select: text; -webkit-user-select: text;
  }
  #name-form button { background: #5be37d; color: #10101c; font-size: 16px; }
  #rotate {
    display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
    background: #10101c; color: #f9d56e; font: bold 22px monospace; text-align: center;
  }
  body.rotate #rotate { display: flex; }
</style>
</head>
<body>
<canvas id="game" width="640" height="360" aria-label="Finger Podium game"></canvas>
<div id="safe-area" aria-hidden="true"></div>
<div id="rotate">ROTATE YOUR TABLET<br>TO PLAY</div>
<form id="name-form" hidden autocomplete="off">
  <input id="name-input" type="text" aria-label="Runner name" placeholder="YOUR NAME"
         autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done">
  <button type="submit">OK</button>
</form>
<script src="input.js"></script>
<script src="countries.js"></script>
<script src="layout.js"></script>
<script src="font.js"></script>
<script src="track.js"></script>
<script src="race.js"></script>
<script src="contest.js"></script>
<script src="longjump.js"></script>
<script src="spin.js"></script>
<script src="shotput.js"></script>
<script src="archery.js"></script>
<script src="boxing.js"></script>
<script src="weightlifting.js"></script>
<script src="moves.js"></script>
<script src="avatar.js"></script>
<script src="render.js"></script>
<script src="scene3d.js"></script>
<script src="fieldui.js"></script>
<script src="art.js"></script>
<script src="home.js"></script>
<script src="menu.js"></script>
<script src="mobile.js"></script>
<script src="longjump-ui.js"></script>
<script src="shotput-ui.js"></script>
<script src="bow-art.js"></script>
<script src="archery-ui.js"></script>
<script src="blocks.js"></script>
<script src="boxing-ui.js"></script>
<script src="lift-art.js"></script>
<script src="weightlifting-ui.js"></script>
<script src="sounds.js"></script>
<script src="synth.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
